<script>
(()=>{
const $=id=>document.getElementById(id),PI=Math.PI;
// ---------- map picker ----------
let c0=[25.0478,121.5170],z0=16;try{const s=JSON.parse(localStorage.getItem('osmrider'));if(s){c0=s.c;z0=s.z}}catch(e){}
const map=L.map('map').setView(c0,z0);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
$('pre').onchange=e=>{if(e.target.value){map.setView(e.target.value.split(',').map(Number),16)}};
$('gps').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],16),()=>alert('無法取得位置'));
async function search(){const q=$('q').value.trim();if(!q)return;try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();r[0]?map.setView([+r[0].lat,+r[0].lon],16):alert('找不到地點')}catch(e){alert('搜尋失敗，請稍後再試')}}
$('sb').onclick=search;$('q').onkeydown=e=>{if(e.key=='Enter')search()};

// ---------- three ----------
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fc4e8);scene.fog=new THREE.Fog(0x8fc4e8,80,320);
const cam=new THREE.PerspectiveCamera(65,1,.5,500);
scene.add(new THREE.HemisphereLight(0xffffff,0x556070,.95));const sun=new THREE.DirectionalLight(0xfff0d0,.8);sun.position.set(80,120,40);scene.add(sun);
const resize=()=>{ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};addEventListener('resize',resize);resize();
const g=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshLambertMaterial({color:0x6d7068}));g.rotation.x=-PI/2;scene.add(g);

// ---------- OSM ----------
const tick=()=>new Promise(r=>{let d=0;const f=()=>d||(d=1,r());requestAnimationFrame(()=>setTimeout(f,0));setTimeout(f,60)});
function setP(p,t){p=Math.min(100,Math.round(p));$('lfill').style.width=p+'%';$('lpct').textContent=p+'%';if(t)$('ltxt').textContent=t}
async function overpass(lat,lon,R,sig){const q=`[out:json][timeout:25];(way["building"](around:${R},${lat},${lon});way["highway"](around:${R},${lat},${lon}););out tags geom;`;
 const us=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.openstreetmap.fr/api/interpreter'];
 const t0=Date.now(),ctls=us.map(()=>new AbortController()),fw=()=>ctls.forEach(c=>c.abort());sig.addEventListener('abort',fw);
 const tm=setInterval(()=>{const t=(Date.now()-t0)/1000;setP(Math.min(9,3+t*.25),'等待伺服器回應… '+(t|0)+' 秒（同時連線 '+us.length+' 個伺服器，取最快者）')},400);
 try{
  const w=await new Promise((res,rej)=>{let fail=0;us.forEach((u,i)=>{const to=setTimeout(()=>ctls[i].abort(),40000);
   fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctls[i].signal})
    .then(r=>{if(!r.ok)throw 0;res({r,i})}).catch(()=>{if(++fail==us.length)rej(0)}).finally(()=>clearTimeout(to))})});
  clearInterval(tm);ctls.forEach((c,k)=>{if(k!=w.i)c.abort()});
  setP(10,'已連上 '+new URL(us[w.i]).hostname+'，下載資料…');let txt;const r=w.r;
  if(r.body&&r.body.getReader){const rd=r.body.getReader(),ch=[];let n=0;for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);n+=value.length;setP(10+30*(1-Math.exp(-n/700000)),'下載資料… '+((n/1024)|0)+' KB')}
   const all=new Uint8Array(n);let o=0;for(const c of ch){all.set(c,o);o+=c.length}txt=new TextDecoder().decode(all)}else txt=await r.text();
  setP(42,'解析資料…');await tick();return JSON.parse(txt).elements
 }catch(e){if(sig.aborted)throw 'abort';throw 0}
 finally{clearInterval(tm);sig.removeEventListener('abort',fw)}}
const hs=id=>((id*2654435761)>>>0)/4294967296;
const RT={motorway:[13,0x2b2d33],trunk:[12,0x2b2d33],primary:[11,0x2e3036],secondary:[10,0x2e3036],tertiary:[9,0x33353b],residential:[7,0x383a40],unclassified:[7,0x383a40],living_street:[6,0x45474c],service:[4.5,0x42444a],pedestrian:[6,0xa9a69c],footway:[2,0xb8b4a8],path:[2,0xb8b4a8],steps:[2,0xb8b4a8],cycleway:[2.5,0x9a7f7a]};
const NOCAR=new Set(['footway','path','steps','cycleway','pedestrian','corridor','bridleway']);
const CELL=30,grid=new Map(),boxes=[],roadsD=[],traffic=[],pool=[];let ORG=null,RAD=450,mini=null;
let winT=null;function makeTex(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#ebe8e0';x.fillRect(0,0,256,256);
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){const X=i*64,Y=j*64;x.fillStyle='#cfcabf';x.fillRect(X,Y+60,64,4);
  x.fillStyle=Math.random()<.2?'#ffe7a0':(Math.random()<.5?'#3d5a7a':'#2f4a66');x.fillRect(X+14,Y+12,36,34);
  x.fillStyle='#ffffff55';x.fillRect(X+14,Y+12,36,6);x.fillStyle='#b9b4a8';x.fillRect(X+11,Y+46,42,4);x.fillStyle='#00000030';x.fillRect(X+31,Y+12,2,34)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;try{t.anisotropy=Math.min(8,ren.capabilities.getMaxAnisotropy()||1)}catch(e){}return t}
function mergeGeo(list){let n=0;list.forEach(o=>n+=o.g.attributes.position.count);const p=new Float32Array(n*3),nm=new Float32Array(n*3),c=new Float32Array(n*3),uv=new Float32Array(n*2);let o=0;
 for(const{g,col,off,offv}of list){const k=g.attributes.position.count,pa=g.attributes.position.array,na=g.attributes.normal.array;p.set(pa,o*3);nm.set(na,o*3);
  for(let i=0;i<k;i++){const x=pa[i*3],y=pa[i*3+1],z=pa[i*3+2],nx=na[i*3],ny=na[i*3+1],nz=na[i*3+2],j=o+i,roof=Math.abs(ny)>.5,m=roof?.7:1;
   c[j*3]=col.r*m;c[j*3+1]=col.g*m;c[j*3+2]=col.b*m;
   if(roof){uv[j*2]=.02;uv[j*2+1]=.02}else{uv[j*2]=(-nz*x+nx*z)/16+off;uv[j*2+1]=y/13.2+offv}}
  o+=k}
 const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.BufferAttribute(p,3));G.setAttribute('normal',new THREE.BufferAttribute(nm,3));G.setAttribute('color',new THREE.BufferAttribute(c,3));G.setAttribute('uv',new THREE.BufferAttribute(uv,2));return G}
function addSeg(a,b){const s={ax:a.x,az:a.z,bx:b.x,bz:b.z};const i0=Math.floor(Math.min(a.x,b.x)/CELL),i1=Math.floor(Math.max(a.x,b.x)/CELL),j0=Math.floor(Math.min(a.z,b.z)/CELL),j1=Math.floor(Math.max(a.z,b.z)/CELL);
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const k=i+','+j;(grid.get(k)||grid.set(k,[]).get(k)).push(s)}}
async function build(els,lat0,lon0,R){
 const kx=111320*Math.cos(lat0*PI/180),ky=110540,cvt=q=>({x:(q.lon-lon0)*kx,z:-(q.lat-lat0)*ky});RAD=R;
 mini=document.createElement('canvas');mini.width=mini.height=2*R+40;const mx=mini.getContext('2d');mx.translate(R+20,R+20);mx.fillStyle='#232830';mx.fillRect(-R-20,-R-20,2*R+40,2*R+40);
 const bl=[],rl=[];let nb=0;
 for(let ei=0;ei<els.length;ei++){const e=els[ei];if(ei%120==0){setP(45+25*ei/els.length,'建立建築物與牆面碰撞… ('+nb+' 棟)');await tick()}if(!e.geometry||e.geometry.length<2)continue;const pts=e.geometry.map(cvt),t=e.tags||{};
  if(t.building){if(nb>2500||pts.length<4)continue;nb++;pts.pop();
   const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(p.x,-p.z)));let h=parseFloat(t.height)||(parseFloat(t['building:levels'])*3.3)||(6+hs(e.id)*16);h=Math.max(4,Math.min(300,h));
   let gg=new THREE.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false});gg.rotateX(-PI/2);if(gg.index)gg=gg.toNonIndexed();
   bl.push({g:gg,col:new THREE.Color().setHSL(.07+hs(e.id+1)*.12,.12+.2*hs(e.id+2),.58+.22*hs(e.id+3)),off:hs(e.id+5)*10,offv:Math.floor(hs(e.id+6)*4)/4});
   for(let i=0;i<pts.length;i++)addSeg(pts[i],pts[(i+1)%pts.length]);
   mx.fillStyle='#5a6070';mx.beginPath();pts.forEach((p,i)=>i?mx.lineTo(p.x,p.z):mx.moveTo(p.x,p.z));mx.fill();
  }else if(t.highway){const rt=RT[t.highway]||[6,0x3a3c42];rl.push({pts,w:rt[0],col:new THREE.Color(rt[1]),name:t.name||t['name:en']||'',car:!NOCAR.has(t.highway)})}}
 setP(70,'繪製道路與小地圖…');await tick();
 const rq=[];for(const r of rl){mx.strokeStyle=r.car?'#8a8f99':'#6a6f70';mx.lineWidth=r.w;mx.lineCap='round';mx.beginPath();r.pts.forEach((p,i)=>i?mx.lineTo(p.x,p.z):mx.moveTo(p.x,p.z));mx.stroke();
  const y=r.car?.12:.16;for(let i=0;i<r.pts.length-1;i++){const a=r.pts[i],b=r.pts[i+1],dx=b.x-a.x,dz=b.z-a.z,l=Math.hypot(dx,dz)||1,nx=-dz/l*r.w/2,nz=dx/l*r.w/2;
   rq.push({a:[a.x+nx,y,a.z+nz],b:[a.x-nx,y,a.z-nz],c:[b.x-nx,y,b.z-nz],d:[b.x+nx,y,b.z+nz],col:r.col})}
  if(r.car)for(const p of r.pts)if(Math.hypot(p.x,p.z)<R*.9)pool.push({x:p.x,z:p.z,n:r.name})}
 setP(82,'建立道路網格…');await tick();
 const pa=new Float32Array(rq.length*18),pc=new Float32Array(rq.length*18),pn=new Float32Array(rq.length*18);rq.forEach((q,i)=>{[q.a,q.b,q.c,q.a,q.c,q.d].forEach((v,j)=>{const o=i*18+j*3;pa.set(v,o);pc.set([q.col.r,q.col.g,q.col.b],o);pn.set([0,1,0],o)})});
 const RG=new THREE.BufferGeometry();RG.setAttribute('position',new THREE.BufferAttribute(pa,3));RG.setAttribute('color',new THREE.BufferAttribute(pc,3));RG.setAttribute('normal',new THREE.BufferAttribute(pn,3));
 scene.add(new THREE.Mesh(RG,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})));
 setP(90,'合併建築模型…');await tick();
 if(bl.length){let mat;try{if(!$('tx').checked)throw 0;winT=winT||makeTex();mat=new THREE.MeshLambertMaterial({vertexColors:true,map:winT})}catch(e){mat=new THREE.MeshLambertMaterial({vertexColors:true})}scene.add(new THREE.Mesh(mergeGeo(bl),mat))}
 setP(95,'放置車流…');await tick();
 const cr=rl.filter(r=>r.car);for(let i=0;i<24&&cr.length;i++){const r=cr[(hs(i+9)*cr.length)|0],cum=[0];for(let k=1;k<r.pts.length;k++)cum.push(cum[k-1]+Math.hypot(r.pts[k].x-r.pts[k-1].x,r.pts[k].z-r.pts[k-1].z));if(cum[cum.length-1]<40)continue;
  const m=carMesh(i);scene.add(m);traffic.push({m,r,cum,tot:cum[cum.length-1],d:hs(i+3)*cum[cum.length-1],dir:i%2?1:-1,s:5+hs(i+5)*6,x:0,z:0})}
 return pool.length>5}
function carMesh(i){const gr=new THREE.Group(),col=new THREE.Color().setHSL(hs(i+40),.6,.5);
 const b=new THREE.Mesh(new THREE.BoxGeometry(2.1,1,4.2),new THREE.MeshLambertMaterial({color:col}));b.position.y=.8;
 const t=new THREE.Mesh(new THREE.BoxGeometry(1.8,.8,2.2),new THREE.MeshLambertMaterial({color:0x223}));t.position.set(0,1.6,-.2);gr.add(b,t);return gr}
function stepTraffic(dt){for(const c of traffic){c.d+=c.dir*c.s*dt;if(c.d>c.tot){c.d=c.tot;c.dir=-1}if(c.d<0){c.d=0;c.dir=1}
 let k=1;while(k<c.cum.length-1&&c.cum[k]<c.d)k++;const a=c.r.pts[k-1],b=c.r.pts[k],t=(c.d-c.cum[k-1])/((c.cum[k]-c.cum[k-1])||1);
 c.x=a.x+(b.x-a.x)*t;c.z=a.z+(b.z-a.z)*t;c.m.position.set(c.x,0,c.z);c.m.rotation.y=Math.atan2(b.x-a.x,b.z-a.z)+(c.dir>0?0:PI)}}
function collide(){const r=1.3,ci=Math.floor(S.x/CELL),cj=Math.floor(S.z/CELL);
 for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){const a=grid.get(i+','+j);if(!a)continue;
  for(const s of a){const dx=s.bx-s.ax,dz=s.bz-s.az;let t=((S.x-s.ax)*dx+(S.z-s.az)*dz)/(dx*dx+dz*dz||1);t=Math.max(0,Math.min(1,t));
   const ex=S.x-(s.ax+dx*t),ez=S.z-(s.az+dz*t),d=Math.hypot(ex,ez);if(d<r){const k=(r-d)/(d||1);S.x+=ex*k;S.z+=ez*k;S.v*=.75}}}}

// ---------- player ----------
const pl=new THREE.Group();{const mat=c=>new THREE.MeshLambertMaterial({color:c}),add=(m,x,y,z)=>{m.position.set(x,y,z);pl.add(m)};
 add(new THREE.Mesh(new THREE.BoxGeometry(.7,.6,2),mat(0xffd84a)),0,.7,0);add(new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mat(0x0a8f6a)),0,1.6,-1);
 add(new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,1.1,8),mat(0x2a4a9a)),0,1.5,.1);add(new THREE.Mesh(new THREE.SphereGeometry(.38,10,8),mat(0xffffff)),0,2.3,.15);
 for(const z of[-.8,.8]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.3,10),mat(0x111));w.rotation.z=PI/2;add(w,0,.35,z)}scene.add(pl)}
const S={x:0,z:0,h:0,v:0,ch:0};
const beacon=new THREE.Mesh(new THREE.CylinderGeometry(4,4,70,20,1,true),new THREE.MeshBasicMaterial({color:0xffa500,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false}));beacon.position.y=35;scene.add(beacon);
const M={money:0,stage:0,from:null,to:null,t:0,combo:0,run:false};
function pickPt(far){let p,n=0;do{p=pool[(Math.random()*pool.length)|0];n++}while(n<40&&Math.hypot(p.x-S.x,p.z-S.z)<far);return p}
function newMission(){M.from=pickPt(80);M.to=null;M.stage=0;setLeg()}
function setLeg(){if(M.stage&&!M.to){let p,n=0;do{p=pickPt(120);n++}while(n<40&&p===M.from);M.to=p}
 const T=M.stage?M.to:M.from;beacon.position.x=T.x;beacon.position.z=T.z;beacon.material.color.set(M.stage?0x28d46a:0xffa500);M.t=Math.hypot(T.x-S.x,T.z-S.z)/10+25;
 toast(M.stage?'🍱 已取餐！送往 '+(M.to.n||'指定地點'):'📍 前往取餐：'+(M.from.n||'指定地點'))}
let tt=0;function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2200)}

// ---------- input ----------
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space'&&M.run)e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
const J={x:0,y:0,brake:0},st=$('stick'),kn=$('knob');let sid=null;
function js(e){const r=st.getBoundingClientRect();let dx=(e.clientX-r.left-60)/50,dy=(e.clientY-r.top-60)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}J.x=dx;J.y=-dy;kn.style.transform=`translate(${dx*35}px,${dy*35}px)`}
st.addEventListener('pointerdown',e=>{sid=e.pointerId;st.setPointerCapture(sid);js(e)});st.addEventListener('pointermove',e=>{if(e.pointerId==sid)js(e)});
const rel=e=>{if(e.pointerId==sid){sid=null;J.x=J.y=0;kn.style.transform=''}};st.addEventListener('pointerup',rel);st.addEventListener('pointercancel',rel);
const br=$('brake');br.addEventListener('pointerdown',()=>J.brake=1);br.addEventListener('pointerup',()=>J.brake=0);br.addEventListener('pointercancel',()=>J.brake=0);

// ---------- loop ----------
const mm=$('mm'),mc=mm.getContext('2d');let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(!M.run){ren.render(scene,cam);return}
 stepTraffic(dt);
 let th=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)+J.y,sx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+J.x;th=Math.max(-1,Math.min(1,th));sx=Math.max(-1,Math.min(1,sx));
 const tg=th>0?th*22:th*8;if(Math.abs(th)>.05)S.v+=(tg-S.v)*Math.min(1,(Math.abs(tg)>Math.abs(S.v)?1.2:2.5)*dt);else S.v*=1-1.1*dt;
 if(K.Space||J.brake)S.v*=1-4.5*dt;
 S.h-=sx*2.3/(1+Math.abs(S.v)*.05)*Math.min(1,S.v/6)*dt;S.x+=Math.sin(S.h)*S.v*dt;S.z+=Math.cos(S.h)*S.v*dt;
 const dr=Math.hypot(S.x,S.z),lim=RAD-15;if(dr>lim){S.x*=lim/dr;S.z*=lim/dr;S.v*=.8}
 collide();
 for(const c of traffic){const d=Math.hypot(S.x-c.x,S.z-c.z);if(d<2.8){const nx=(S.x-c.x)/(d||1),nz=(S.z-c.z)/(d||1);S.x+=nx*(2.8-d);S.z+=nz*(2.8-d);if(Math.abs(S.v)>6){M.money=Math.max(0,M.money-10);toast('💥 擦撞！ -$10')}S.v*=-.3}}
 M.t-=dt;const T=M.stage?M.to:M.from,dist=Math.hypot(T.x-S.x,T.z-S.z);
 if(dist<8){if(!M.stage){M.stage=1;setLeg()}else{const b=100+Math.floor(M.t*3);M.money+=b;M.combo++;toast(`✅ 送達！ +$${b}（連續 ${M.combo}）`);newMission()}}
 else if(M.t<=0){M.money=Math.max(0,M.money-50);M.combo=0;toast('⏰ 超時！ -$50');newMission()}
 $('top').innerHTML=`<b>$${M.money}</b>　連續 ${M.combo}<br>${M.stage?'🍱 送至':'📍 取餐'}：${T.n||'指定地點'}（${Math.round(dist)}m）<br>⏱ ${Math.max(0,M.t).toFixed(0)}s`;
 $('spd').innerHTML=`<b>${Math.round(Math.abs(S.v)*3.6)}</b> km/h`;
 pl.position.set(S.x,0,S.z);pl.rotation.y=S.h;
 const dh=Math.atan2(Math.sin(S.h-S.ch),Math.cos(S.h-S.ch));S.ch+=dh*Math.min(1,3.5*dt);const sp=Math.abs(S.v);
 cam.position.set(S.x-Math.sin(S.ch)*(9+sp*.12),5.2+sp*.04,S.z-Math.cos(S.ch)*(9+sp*.12));cam.lookAt(S.x+Math.sin(S.ch)*5,1.8,S.z+Math.cos(S.ch)*5);
 const bs=1+Math.sin(ts/200)*.08;beacon.scale.set(bs,1,bs);
 mc.clearRect(0,0,220,220);mc.save();mc.beginPath();mc.arc(110,110,108,0,7);mc.clip();mc.fillStyle='#232830';mc.fillRect(0,0,220,220);
 mc.translate(110,110);mc.rotate(S.h+PI);mc.scale(.9,.9);mc.translate(-S.x,-S.z);mc.drawImage(mini,-RAD-20,-RAD-20);
 mc.fillStyle=M.stage?'#28d46a':'#ffa500';mc.beginPath();mc.arc(T.x,T.z,10,0,7);mc.fill();mc.restore();
 mc.fillStyle='#fff';mc.beginPath();mc.moveTo(110,98);mc.lineTo(117,118);mc.lineTo(103,118);mc.fill();
 ren.render(scene,cam)}
requestAnimationFrame(loop);

let abort=null;$('cancel').onclick=()=>{if(abort)abort.abort();$('load').style.display='none'};
$('start').onclick=async()=>{const c=map.getCenter(),R=+$('rad').value;try{localStorage.setItem('osmrider',JSON.stringify({c:[c.lat,c.lng],z:map.getZoom()}))}catch(e){}
 const ctl=abort=new AbortController();let built=false;$('cancel').style.display='';$('load').style.display='flex';setP(2,'準備中…');
 try{const els=await overpass(c.lat,c.lng,R,ctl.signal);$('cancel').style.display='none';built=true;
  if(!(await build(els,c.lat,c.lng,R)))throw 1;
  setP(98,'定位出發點…');await tick();
  const p=pool.reduce((a,b)=>Math.hypot(b.x,b.z)<Math.hypot(a.x,a.z)?b:a);S.x=p.x;S.z=p.z;
  const q=pool.find(o=>o!==p&&Math.hypot(o.x-p.x,o.z-p.z)>4&&Math.hypot(o.x-p.x,o.z-p.z)<40)||{x:p.x,z:p.z+1};S.h=S.ch=Math.atan2(q.x-p.x,q.z-p.z);
  setP(100,'完成！出發！');await tick();
  $('pick').style.display='none';$('load').style.display='none';M.run=true;newMission();
  if(document.documentElement.requestFullscreen&&matchMedia('(pointer:coarse)').matches)document.documentElement.requestFullscreen().catch(()=>{})
 }catch(e){if(ctl.signal.aborted)return;$('load').style.display='none';alert('此處無法載入道路資料（可能網路或 Overpass 伺服器忙碌，或該區域資料不足），請換個地點或縮小範圍再試。\n（錯誤：'+String(e&&e.message||e)+'）');if(built)location.reload()}};

// ---------- PWA ----------
try{const ic=n=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#0b1020';x.fillRect(0,0,n,n);x.font=n*.6+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🛵',n/2,n/2+n*.04);return c.toDataURL()};
 const man={name:'OSM 城市外送英雄',short_name:'城市外送',start_url:location.href.split('#')[0],display:'standalone',orientation:'any',background_color:'#0b1020',theme_color:'#0b1020',icons:[{src:ic(192),sizes:'192x192',type:'image/png'},{src:ic(512),sizes:'512x512',type:'image/png'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(l);
 const ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href=ic(180);document.head.appendChild(ai)}catch(e){}
try{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').style.display='inline-block'});$('inst').onclick=()=>dp&&dp.prompt();
})();
</script></body></html>
